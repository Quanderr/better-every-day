name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_DIR: infra/terraform/aws
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VERSION: 1.17.2
  UV_VERSION: 0.9.5
  TF_VAR_region: ${{ vars.AWS_REGION }}
  BED_CONFIG_PATH: .tools/ci-config.yaml
  TF_VAR_config_path: ../../../.tools/ci-config.yaml
  TF_VAR_network_mode: ${{ vars.BED_NETWORK_MODE || 'cheap' }}
  TF_VAR_schedules_enabled: ${{ vars.BED_SCHEDULES_ENABLED || 'false' }}
  TF_VAR_bedrock_usd_per_million_tokens: ${{ vars.BED_MODEL_PRICES || '{"input":4,"output":20,"cache_read":0.2,"cache_write":5}' }}
  TF_VAR_worker_image_tag: ${{ github.sha }}
  TF_VAR_control_image_tag: ${{ github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: uv run bed validate config/example.yaml
      - run: terraform fmt -check -recursive infra/terraform

  images:
    permissions:
      contents: read
      id-token: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: load deployment configuration
        env:
          BED_CONFIG_YAML: ${{ secrets.BED_CONFIG_YAML }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .tools
          test -n "$BED_CONFIG_YAML" || { echo 'Missing BED_CONFIG_YAML repository secret'; exit 1; }
          printf '%s' "$BED_CONFIG_YAML" > "$BED_CONFIG_PATH"
          test "$TF_VAR_network_mode" = cheap || { echo 'This deployment is restricted to cheap network mode'; exit 1; }
          uv run bed validate "$BED_CONFIG_PATH"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform init
        run: |
          [ -f "$TF_DIR/backend.tf" ] || printf 'terraform {\n  backend "s3" {}\n}\n' > "$TF_DIR/backend.tf"
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'better-every-day/terraform.tfstate' }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: ensure ECR repositories
        run: terraform -chdir="$TF_DIR" apply -auto-approve -target=aws_ecr_repository.worker -target=aws_ecr_repository.control
      - name: build and push images
        run: |
          set -euo pipefail
          WORKER_REPO=$(terraform -chdir="$TF_DIR" output -raw worker_repository_url)
          CONTROL_REPO=$(terraform -chdir="$TF_DIR" output -raw control_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${WORKER_REPO%%/*}"
          for pair in "worker:$WORKER_REPO" "control:$CONTROL_REPO"; do
            kind=${pair%%:*}
            repo=${pair#*:}
            if aws ecr describe-images --repository-name "${repo#*/}" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$kind image $GITHUB_SHA already pushed"
              continue
            fi
            docker build --platform linux/arm64 -f "docker/$kind.Dockerfile" -t "$repo:$GITHUB_SHA" .
            docker push "$repo:$GITHUB_SHA"
          done

  plan:
    permissions:
      contents: read
      id-token: write
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: load deployment configuration
        env:
          BED_CONFIG_YAML: ${{ secrets.BED_CONFIG_YAML }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .tools
          test -n "$BED_CONFIG_YAML" || { echo 'Missing BED_CONFIG_YAML repository secret'; exit 1; }
          printf '%s' "$BED_CONFIG_YAML" > "$BED_CONFIG_PATH"
          test "$TF_VAR_network_mode" = cheap || { echo 'This deployment is restricted to cheap network mode'; exit 1; }
          uv run bed validate "$BED_CONFIG_PATH"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform init
        run: |
          [ -f "$TF_DIR/backend.tf" ] || printf 'terraform {\n  backend "s3" {}\n}\n' > "$TF_DIR/backend.tf"
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'better-every-day/terraform.tfstate' }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: terraform plan
        run: |
          terraform -chdir="$TF_DIR" plan -lock=false -out=tfplan
          terraform -chdir="$TF_DIR" show -json tfplan > "$RUNNER_TEMP/plan.json"
          python - "$RUNNER_TEMP/plan.json" <<'PY'
          import json
          import sys
          plan = json.load(open(sys.argv[1]))
          for resource in plan.get("resource_changes", []):
              after = resource["change"].get("after")
              if not after:
                  continue
              kind = resource["type"]
              assert not kind.startswith("aws_networkfirewall_"), resource["address"]
              assert kind != "aws_instance", resource["address"]
              assert kind != "aws_vpc_endpoint" or after.get("vpc_endpoint_type") != "Interface", resource["address"]
          print("Cheap-mode plan verified: no Network Firewall, EC2 proxy, or paid interface endpoints")
          PY
          {
            echo '```'
            terraform -chdir="$TF_DIR" show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    permissions:
      contents: read
      id-token: write
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: load deployment configuration
        env:
          BED_CONFIG_YAML: ${{ secrets.BED_CONFIG_YAML }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .tools
          test -n "$BED_CONFIG_YAML" || { echo 'Missing BED_CONFIG_YAML repository secret'; exit 1; }
          printf '%s' "$BED_CONFIG_YAML" > "$BED_CONFIG_PATH"
          test "$TF_VAR_network_mode" = cheap || { echo 'This deployment is restricted to cheap network mode'; exit 1; }
          uv run bed validate "$BED_CONFIG_PATH"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: verify model access before provisioning
        run: |
          set -euo pipefail
          MODEL_ID=$(uv run python -c 'import os, yaml; print(yaml.safe_load(open(os.environ["BED_CONFIG_PATH"]))["model"]["id"])')
          for attempt in {1..20}; do
            if aws bedrock-runtime converse --model-id "$MODEL_ID" \
              --messages '[{"role":"user","content":[{"text":"Reply OK."}]}]' \
              --inference-config '{"maxTokens":128}' --query usage 2>"$RUNNER_TEMP/model-error"; then
              exit 0
            fi
            cat "$RUNNER_TEMP/model-error" >&2
            if ! grep -q 'not available for this account' "$RUNNER_TEMP/model-error" || [ "$attempt" = 20 ]; then
              exit 1
            fi
            echo "Waiting 30 seconds for model-access activation ($attempt/20)"
            sleep 30
          done
      - name: terraform init
        run: |
          [ -f "$TF_DIR/backend.tf" ] || printf 'terraform {\n  backend "s3" {}\n}\n' > "$TF_DIR/backend.tf"
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'better-every-day/terraform.tfstate' }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}
      - run: terraform -chdir="$TF_DIR" apply tfplan
