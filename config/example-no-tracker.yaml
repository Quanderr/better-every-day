model:
  provider: bedrock
  id: us.moonshotai.kimi-k3.1
  prices: {input: 4.4, output: 22, cache_read: 0.22, cache_write: 5.5}
connectors:
  vcs:
    main-github:
      type: github
      auth_secret: bed/github-app
defaults:
  categories: [bug, error-handling, test-gap]
repos:
  - name: acme/web
    vcs: main-github
    schedule: "0 5 * * 1-5"
    timezone: Europe/Warsaw
    verify:
      install: pnpm install --frozen-lockfile
      commands: [pnpm lint, pnpm test]
