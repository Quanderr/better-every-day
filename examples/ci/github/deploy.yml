name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_DIR: infra/terraform/aws
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VERSION: 1.15.8
  UV_VERSION: 0.9.5
  TF_VAR_region: ${{ vars.AWS_REGION }}
  BED_CONFIG_PATH: ${{ vars.BED_CONFIG_PATH }}
  TF_VAR_config_path: ../../../${{ vars.BED_CONFIG_PATH }}
  TF_VAR_network_mode: ${{ vars.BED_NETWORK_MODE || 'firewall' }}
  TF_VAR_worker_image_tag: ${{ github.sha }}
  TF_VAR_control_image_tag: ${{ github.sha }}

# Terraform plan/apply output is private: old state may contain config YAML.
# Emit only filtered diagnostics; never print raw output or upload plans.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: uv run bed validate "$BED_CONFIG_PATH"
      - run: terraform fmt -check -recursive infra/terraform

  plan-pr:
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform init
        run: |
          [ -f "$TF_DIR/backend.tf" ] || printf 'terraform {\n  backend "s3" {}\n}\n' > "$TF_DIR/backend.tf"
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'better-every-day/terraform.tfstate' }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - run: python scripts/ci/terraform.py -chdir="$TF_DIR" plan -lock=false

  images:
    permissions:
      contents: read
      id-token: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform init
        run: |
          [ -f "$TF_DIR/backend.tf" ] || printf 'terraform {\n  backend "s3" {}\n}\n' > "$TF_DIR/backend.tf"
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'better-every-day/terraform.tfstate' }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: ensure ECR repositories
        run: python scripts/ci/terraform.py -chdir="$TF_DIR" apply -auto-approve -target=aws_ecr_repository.worker -target=aws_ecr_repository.control
      - name: build and push images
        run: |
          set -euo pipefail
          WORKER_REPO=$(terraform -chdir="$TF_DIR" output -raw worker_repository_url)
          CONTROL_REPO=$(terraform -chdir="$TF_DIR" output -raw control_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${WORKER_REPO%%/*}"
          for pair in "worker:$WORKER_REPO" "control:$CONTROL_REPO"; do
            kind=${pair%%:*}
            repo=${pair#*:}
            if aws ecr describe-images --repository-name "${repo#*/}" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$kind image $GITHUB_SHA already pushed"
              continue
            fi
            docker build --platform linux/arm64 -f "docker/$kind.Dockerfile" -t "$repo:$GITHUB_SHA" .
            docker push "$repo:$GITHUB_SHA"
          done

  plan:
    permissions:
      contents: read
      id-token: write
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform init
        run: |
          [ -f "$TF_DIR/backend.tf" ] || printf 'terraform {\n  backend "s3" {}\n}\n' > "$TF_DIR/backend.tf"
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'better-every-day/terraform.tfstate' }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: terraform plan
        run: python scripts/ci/terraform.py -chdir="$TF_DIR" plan -lock=false

  apply:
    permissions:
      contents: read
      id-token: write
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform init
        run: |
          [ -f "$TF_DIR/backend.tf" ] || printf 'terraform {\n  backend "s3" {}\n}\n' > "$TF_DIR/backend.tf"
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'better-every-day/terraform.tfstate' }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      # Re-plan after approval; never transfer a plaintext plan as an artifact.
      - run: python scripts/ci/terraform.py -chdir="$TF_DIR" apply -auto-approve
